<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Secure Chat</title>
    <style>
        body { font-family: sans-serif; background: #0b0e11; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #15191c; padding: 30px; border-radius: 15px; text-align: center; width: 90%; max-width: 350px; border: 1px solid #2d3439; }
        .hidden { display: none !important; }
        button { background: #00a884; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <div id="install-ui" class="box">
        <h2>Install Chat</h2>
        <p>Click below to install and unlock the chat.</p>
        <button id="btn-install">Install Now</button>
    </div>

    <div id="chat-ui" class="box hidden">
        <h2>Chat Unlocked</h2>
        <input type="password" id="pw" style="width:100%; padding:10px; margin:10px 0;" placeholder="Password">
        <button onclick="alert('Logged in!')">Login</button>
        <p id="fid" style="font-size: 10px; color: gray; margin-top: 10px;"></p>
    </div>

    <script>
        let deferredPrompt;

        // 1. Register Service Worker (Fixes 404)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // 2. Check if already installed
        function checkStatus() {
            if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
                document.getElementById('install-ui').classList.add('hidden');
                document.getElementById('chat-ui').classList.remove('hidden');
                document.getElementById('fid').innerText = "Device: " + screen.width + "x" + screen.height;
            }
        }

        // 3. Simple Install Button
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        document.getElementById('btn-install').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
            } else {
                alert("Please wait a moment for the browser to load the app, or use 'Add to Home Screen' in your browser menu.");
            }
        });

        checkStatus();
    </script>
</body>
</html>
