<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Secure Fingerprint Chat</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0e11; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #15191c; padding: 30px; border-radius: 15px; text-align: center; width: 90%; max-width: 400px; border: 1px solid #2d3439; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }
        button { background: #00a884; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1rem; }
        button:active { opacity: 0.8; }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: 1px solid #2d3439; background: #202c33; color: white; box-sizing: border-box; outline: none; }
        #fingerprint-display { font-size: 0.7rem; color: #8696a0; word-break: break-all; margin-top: 10px; display: block; }
    </style>
</head>
<body>

    <div id="install-ui" class="box">
        <div style="font-size: 3rem; margin-bottom: 10px;">🔒</div>
        <h2>App Installation Required</h2>
        <p style="color: #8696a0;">To protect your chat and generate a device fingerprint, you must install this app.</p>
        <button id="btn-install">Install to Device</button>
    </div>

    <div id="chat-ui" class="box hidden">
        <h2>Identity Verified</h2>
        <p style="color: #8696a0;">Enter your password to access the chat.</p>
        <input type="password" id="chat-pass" placeholder="Password">
        <button id="btn-unlock">Unlock Chat</button>
        <code id="fingerprint-display">Generating Device ID...</code>
    </div>

    <script>
        let deferredPrompt;
        const installUI = document.getElementById('install-ui');
        const chatUI = document.getElementById('chat-ui');

        // 1. REGISTER SERVICE WORKER
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker Registered"));
        }

        // 2. DETECTION LOGIC
        function checkStatus() {
            // Checks if running in standalone/installed mode
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches 
                                || window.navigator.standalone 
                                || document.referrer.includes('android-app://');

            if (isStandalone) {
                installUI.classList.add('hidden');
                chatUI.classList.remove('hidden');
                generateDeviceFingerprint();
            }
        }

        // 3. CAPTURE THE INSTALL EVENT
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            console.log("Install prompt ready");
        });

        document.getElementById('btn-install').addEventListener('click', async () => {
            if (!deferredPrompt) {
                alert("Please wait a moment for the browser to initialize the installer, or use 'Add to Home Screen' in your browser menu manually.");
                return;
            }
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                deferredPrompt = null;
            }
        });

        // 4. FINGERPRINTING
        async function generateDeviceFingerprint() {
            const info = `${navigator.userAgent}|${screen.width}x${screen.height}|${new Date().getTimezoneOffset()}`;
            const encoder = new TextEncoder();
            const data = encoder.encode(info);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            document.getElementById('fingerprint-display').innerText = "Device ID: " + hashHex.substring(0, 24);
        }

        // 5. UNLOCK LOGIC
        document.getElementById('btn-unlock').addEventListener('click', () => {
            const pass = document.getElementById('chat-pass').value;
            if (pass === "1234") { // Set your own password here
                alert("Access Granted! Welcome to the chat.");
            } else {
                alert("Access Denied: Invalid Password.");
            }
        });

        // Check on startup
        setInterval(checkStatus, 1000); // Poll every second in case state changes
        checkStatus();
    </script>
</body>
</html>
