<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>Chat Login</title>
    <style>
        body { font-family: sans-serif; background: #0b0e11; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1c1f23; padding: 25px; border-radius: 12px; width: 320px; text-align: center; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 1px solid #444; background: #2c3136; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #00a884; color: white; font-weight: bold; cursor: pointer; }
        #fingerprint { font-size: 10px; color: #666; margin-top: 15px; display: block; word-break: break-all; }
    </style>
</head>
<body>

    <div class="login-card">
        <h3>Secure Access</h3>
        <p style="font-size: 0.8rem; color: #888;">Hardware Fingerprinting Active</p>
        
        <input type="password" id="user-pass" placeholder="Enter Password">
        <button id="login-btn">Login</button>

        <span id="fingerprint">ID: Loading...</span>
    </div>

    <script>
        // Register the service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        // Generate the unique Device ID
        async function getID() {
            const data = `${navigator.userAgent}-${screen.width}x${screen.height}-${Intl.DateTimeFormat().resolvedOptions().timeZone}`;
            const encoder = new TextEncoder();
            const buffer = encoder.encode(data);
            const hash = await crypto.subtle.digest('SHA-256', buffer);
            const hex = Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
            const shortID = hex.substring(0, 16).toUpperCase();
            document.getElementById('fingerprint').innerText = "DEVICE ID: " + shortID;
            return shortID;
        }

        // Handle Login
        document.getElementById('login-btn').addEventListener('click', async () => {
            const input = document.getElementById('user-pass').value;
            const deviceID = await getID();

            // SIMPLE PASSWORD CHECK
            if (input === "chat123") {
                alert("SUCCESS!\nAccess granted for device: " + deviceID);
                // window.location.href = "your-chat-link.html"; 
            } else {
                alert("WRONG PASSWORD");
            }
        });

        getID();
    </script>
</body>
</html>
