<!DOCTYPE html>
<html>
<head>
    <link rel="manifest" href="/manifest.json">
    <style>
        #chat-interface { display: none; } /* Hidden by default */
        #install-screen { display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="install-screen">
        <h1>Secure Chat</h1>
        <p>This chat requires a hardware fingerprint. Please install the app to proceed.</p>
        <button id="install-btn" style="padding: 15px; font-size: 1.2rem;">Install Chat App</button>
    </div>

    <div id="chat-interface">
        <h2>Welcome Back</h2>
        <input type="password" id="pass" placeholder="Enter Password">
        <button onclick="attemptLogin()">Login</button>
    </div>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        const chatUI = document.getElementById('chat-interface');
        const installUI = document.getElementById('install-screen');

        // 1. CHECK IF ALREADY INSTALLED (STANDALONE MODE)
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
            installUI.classList.add('hidden');
            chatUI.style.display = 'block';
        }

        // 2. CAPTURE INSTALL PROMPT
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    alert("App installed! Please open it from your home screen.");
                }
            }
        });

        // 3. FINGERPRINT & LOGIN
        async function attemptLogin() {
            const fingerprint = await generateFingerprint();
            const password = document.getElementById('pass').value;

            // Send to your backend
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password, fingerprint })
            });
            
            if(res.ok) alert("Access Granted");
        }

        async function generateFingerprint() {
            const data = `${navigator.userAgent}-${screen.width}-${new Date().getTimezoneOffset()}`;
            const msgBuffer = new TextEncoder().encode(data);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
    </script>
</body>
</html>
